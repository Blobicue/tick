[workspace]
resolver = "2"
members = [
    "crates/tick-kernels",
    "crates/tick-format",
    "crates/tick-token",
    "crates/tick-engine",
    "crates/tick-train",
    "crates/tick-plugin",
    "crates/tick-example-plugin",
    "crates/tick-server",
    "crates/tick-registry",
    "crates/tick-pkg",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Blobicue/tick"
homepage = "https://github.com/Blobicue/tick"

[workspace.dependencies]
tick-kernels = { path = "crates/tick-kernels", version = "0.1.0", registry = "tick" }
tick-format = { path = "crates/tick-format", version = "0.1.0", registry = "tick" }
tick-token = { path = "crates/tick-token", version = "0.1.0", registry = "tick" }
tick-engine = { path = "crates/tick-engine", version = "0.1.0", registry = "tick" }
tick-plugin = { path = "crates/tick-plugin", version = "0.1.0", registry = "tick" }
tick-registry = { path = "crates/tick-registry", version = "0.1.0", registry = "tick" }
tick-example-plugin = { path = "crates/tick-example-plugin", version = "0.1.0", registry = "tick" }
tick-train = { path = "crates/tick-train", version = "0.1.0", registry = "tick" }
libc = "0.2"
axum = { version = "0.8", features = ["json"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros", "io-util", "fs"] }
tokio-stream = { version = "0.1", features = ["sync"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde = { version = "1", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
sha2 = "0.10"
hex = "0.4"
flate2 = "1"
tar = "0.4"
tempfile = "3"
